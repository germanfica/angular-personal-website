
<div class="input">
    <input [disabled]="disable" *ngIf="type=='input'" [value]="value ?? ''" (input)="change($any($event.target).value)" (blur)="onTouched()" type="text" class="input-field" name="name" required />
    <textarea [disabled]="disable" *ngIf="type=='textarea'" [value]="value ?? ''" (input)="change($any($event.target).value)" (blur)="onTouched()" class="input-field" name="message" required></textarea>
    <label class="input-label">{{label}}</label>
</div>
<div class="message-section">
    <label class="hint">{{ serializedNestedHintTextContent }}</label>
    <label class="error">{{ serializedNestedErrorTextContent }}</label>
</div>
